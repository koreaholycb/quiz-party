<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오늘의 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#2b3bff;--ink:#12122b;--y:#ffe14d;--p:#ff6fb1;--soft:#eef0ff}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--bg);color:#fff;font-family:Jua,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{max-width:460px;margin:0 auto;padding:28px 0 40px}
h1{font-size:44px;line-height:1.1;margin:0 0 6px;font-weight:400}
.sub{margin:0 0 18px;opacity:.85}
.card{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);padding:18px;margin-bottom:16px}
input,button{font:inherit;width:100%;border:3px solid var(--ink);border-radius:14px;padding:13px 14px;font-size:18px}
input{background:#fff;color:var(--ink);margin-bottom:10px}
input:focus-visible,button:focus-visible{outline:3px solid var(--p);outline-offset:2px}
button{background:var(--y);color:var(--ink);cursor:pointer;margin-bottom:10px;box-shadow:3px 3px 0 var(--ink)}
button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
button.g{background:#fff}
.err{color:#c4004f;min-height:1.2em;margin:0}
.track{height:14px;background:#fff;border:3px solid var(--ink);border-radius:9px;overflow:hidden;margin:10px 0 16px}
#bar{height:100%;width:100%;background:var(--p)}
#hint{margin:0;opacity:.7;text-align:center}
.q{font-size:46px;text-align:center;margin:18px 0 6px;letter-spacing:.06em;word-break:keep-all}
#msg{min-height:1.5em;text-align:center;font-size:20px;margin:6px 0 12px}
ol{list-style:none;padding:0;margin:8px 0 0}
li{display:flex;gap:10px;background:var(--soft);padding:11px 14px;border-radius:12px;margin-bottom:8px}
li.me{background:var(--y)}
li span{margin-left:auto}
.big{font-size:34px;margin:0}
.shake{animation:sk .3s}@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media(prefers-reduced-motion:reduce){.shake{animation:none}#bar{transition:none!important}}
[hidden]{display:none!important}
</style></head><body><main>

<section id="intro">
  <h1>오늘의<br>퀴즈</h1>
  <p class="sub">오늘 모두가 같은 10문제! 빨리 맞힐수록 점수가 높아요.</p>
  <div class="card">
    <input id="nm" placeholder="내 이름 (8자까지)" maxlength="8">
    <button id="go">도전 시작</button>
    <p class="err" id="err"></p>
  </div>
  <div class="card"><b>오늘의 순위</b><p id="bt" style="margin:6px 0 0"></p><ol id="bd"></ol></div>
  <button class="g" onclick="location.href='/'">친구들과 방 만들어 대결하기</button>
</section>

<section id="play" hidden>
  <p id="top" class="big"></p>
  <div class="track"><div id="bar"></div></div>
  <div class="card"><p id="hint"></p><div class="q" id="qq"></div></div>
  <div id="msg"></div>
  <form id="qf">
    <input id="ans" autocomplete="off" placeholder="정답 입력">
    <button type="submit">제출</button>
  </form>
  <button id="skip" class="g" type="button">모르겠어요, 넘기기</button>
</section>

<section id="done" hidden>
  <h1>오늘 결과</h1>
  <div class="card"><p class="big" id="sc"></p><p id="ok" style="margin:4px 0"></p><p id="rk" style="margin:0"></p></div>
  <div class="card"><b>오늘의 순위</b><p id="bt2" style="margin:6px 0 0"></p><ol id="bd2"></ol></div>
  <button id="share">결과 복사해서 자랑하기</button>
  <button class="g" onclick="location.href='/'">친구들과 방 만들어 대결하기</button>
</section>

</main>
<script>
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const medal = i => ['🥇', '🥈', '🥉'][i] || i + 1;
const post = (p, b) => fetch('/solo/' + p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) }).then(r => r.json());
const show = id => ['intro', 'play', 'done'].forEach(x => $(x).hidden = x !== id);
let tok, timer, busy = false, me = '', shareText = '';

async function board(ol, txt, lim) {
  const d = await fetch('/solo/rank').then(r => r.json()).catch(() => null);
  if (!d) { ol.innerHTML = ''; txt.textContent = '순위를 불러오지 못했어요. 새로고침해 주세요.'; return; }
  txt.textContent = d.total ? `오늘 ${d.total}명이 도전했어요` : '아직 아무도 없어요. 첫 번째 도전자가 되어 보세요!';
  ol.innerHTML = d.top.slice(0, lim).map((p, i) =>
    `<li class="${p.name.toLowerCase() === me.toLowerCase() ? 'me' : ''}"><b>${medal(i)}</b> ${esc(p.name)}<span>${p.score}점</span></li>`).join('');
}
board($('bd'), $('bt'), 10);

$('go').onclick = async () => {
  me = $('nm').value.trim().slice(0, 8);
  const o = await post('start', { name: me });
  if (o.err) return $('err').textContent = o.err;
  tok = o.token; show('play'); showQ(o.q);
};
function showQ(q) {
  busy = false;
  $('top').textContent = `${q.i + 1}/${q.n} ${q.title}`;
  $('hint').textContent = q.hint; $('qq').textContent = q.q;
  $('ans').value = ''; $('ans').focus();
  const bar = $('bar');
  bar.style.transition = 'none'; bar.style.width = '100%';
  requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = `width ${q.sec}s linear`; bar.style.width = '0'; }));
  clearTimeout(timer);
  timer = setTimeout(async () => { if (!busy) handle(await post('skip', { token: tok }), true); }, q.sec * 1000 + 300);
}
function handle(o, timeout) {
  if (o.err) { alert(o.err); return show('intro'); }
  clearTimeout(timer); busy = true;
  $('msg').textContent = o.gained ? `정답! +${o.gained}점 (${o.answer})` : `${timeout ? '시간 초과 · ' : ''}정답은 ${o.answer}`;
  setTimeout(() => { $('msg').textContent = ''; o.done ? finish(o) : showQ(o.q); }, 1500);
}
$('qf').onsubmit = async e => {
  e.preventDefault();
  const v = $('ans').value.trim();
  if (!v || busy) return;
  const o = await post('answer', { token: tok, text: v });
  if (o.wrong) { $('ans').value = ''; $('ans').classList.add('shake'); setTimeout(() => $('ans').classList.remove('shake'), 300); return; }
  handle(o);
};
$('skip').onclick = async () => { if (!busy) handle(await post('skip', { token: tok })); };

function finish(o) {
  show('done');
  $('sc').textContent = o.score + '점';
  $('ok').textContent = `${o.ok}/${o.n} 정답`;
  $('rk').textContent = o.recorded ? `오늘 ${o.rank}등 (총 ${o.total}명 중)` : '순위에 기록되지 않았어요. (날짜가 바뀌었거나 같은 이름이 이미 있어요)';
  shareText = `🏆 오늘의 퀴즈 ${o.score}점${o.recorded ? ` (${o.rank}등)` : ''}\n` + location.origin + '/solo.html';
  board($('bd2'), $('bt2'), 20);
}
$('share').onclick = async () => {
  try { await navigator.clipboard.writeText(shareText); $('share').textContent = '복사됨!'; setTimeout(() => $('share').textContent = '결과 복사해서 자랑하기', 1500); }
  catch { prompt('복사해서 친구에게 보내세요', shareText); }
};
</script></body></html>
