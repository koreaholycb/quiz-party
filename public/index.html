<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3분 퀴즈파티</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#2b3bff;--ink:#12122b;--y:#ffe14d;--p:#ff6fb1;--soft:#eef0ff}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--bg);color:#fff;font-family:Jua,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{max-width:460px;margin:0 auto;padding:28px 0 40px}
h1{font-size:44px;line-height:1.1;margin:0 0 6px;font-weight:400}
.sub{margin:0 0 22px;opacity:.85}
.card{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);padding:18px;margin-bottom:16px}
input,button{font:inherit;width:100%;border:3px solid var(--ink);border-radius:14px;padding:13px 14px;font-size:18px}
input{background:#fff;color:var(--ink);margin-bottom:10px}
input:focus-visible,button:focus-visible{outline:3px solid var(--p);outline-offset:2px}
button{background:var(--y);color:var(--ink);cursor:pointer;margin-bottom:10px;box-shadow:3px 3px 0 var(--ink)}
button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
button.g{background:#fff}
.err{color:#c4004f;min-height:1.2em;margin:0}
.chip{display:inline-block;background:var(--soft);border:2px solid var(--ink);padding:6px 14px;border-radius:99px;margin:0 6px 8px 0}
.code{font-size:60px;text-align:center;letter-spacing:.12em;margin:4px 0 12px}
.track{height:14px;background:#fff;border:3px solid var(--ink);border-radius:9px;overflow:hidden;margin:10px 0 16px}
#bar{height:100%;width:100%;background:var(--p)}
#hint{margin:0;opacity:.7;text-align:center}
.q{font-size:46px;text-align:center;margin:18px 0 6px;letter-spacing:.06em;word-break:keep-all}
#tap{height:230px;font-size:60px;background:var(--p);color:#fff;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#feed div{margin:5px 0}
#res{position:fixed;inset:0;background:#1a24c9f2;padding:28px 16px;overflow:auto}
#res .in{max-width:460px;margin:0 auto}
ol{list-style:none;padding:0;margin:12px 0 0}
li{display:flex;gap:10px;background:var(--soft);padding:11px 14px;border-radius:12px;margin-bottom:8px}
li span{margin-left:auto}
.big{font-size:34px;margin:0}
.shake{animation:sk .3s}@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media(prefers-reduced-motion:reduce){.shake{animation:none}#bar{transition:none!important}}
[hidden]{display:none!important}
</style></head><body><main>

<section id="home">
  <h1>3분<br>퀴즈파티</h1>
  <p class="sub">링크만 보내면 친구들이 바로 들어와요</p>
  <div class="card">
    <input id="nm" placeholder="내 이름 (8자까지)" maxlength="8">
    <button id="mk">방 만들기</button>
    <input id="code" placeholder="받은 방 코드" maxlength="4" style="text-transform:uppercase">
    <button id="jn" class="g">코드로 입장</button>
    <p class="err" id="err"></p>
  </div>
</section>

<section id="lobby" hidden>
  <p class="sub">친구에게 이 코드를 알려주세요</p>
  <div class="card"><div class="code" id="rc"></div>
    <button id="cl" class="g">초대 링크 복사</button>
    <div id="pl"></div></div>
  <button id="go">게임 시작</button>
  <p id="wait" class="sub">방장이 시작하길 기다리는 중…</p>
</section>

<section id="play" hidden>
  <p id="top" class="big"></p>
  <div class="track"><div id="bar"></div></div>
  <div class="card">
    <p id="hint"></p>
    <div class="q" id="qq"></div>
  </div>
  <form id="qf"><div id="quiz">
    <input id="ans" autocomplete="off" placeholder="정답 입력">
    <button type="submit">제출</button>
  </div></form>
  <button id="tap" hidden>TAP!</button>
  <div id="feed"></div>
  <div id="res" hidden><div class="in">
    <p class="sub" id="ra"></p>
    <p class="big" id="rg"></p>
    <div class="card"><ol id="rb"></ol></div>
  </div></div>
</section>

<section id="end" hidden>
  <h1>최종 순위</h1>
  <div class="card"><ol id="rk"></ol></div>
  <button id="share">결과 복사해서 자랑하기</button>
  <button id="again" class="g">한 판 더</button>
</section>

</main>
<script src="/socket.io/socket.io.js"></script>
<script>
const $ = id => document.getElementById(id), s = io();
let st = null, over = false, cnt = 0;
const show = id => ['home', 'lobby', 'play', 'end'].forEach(x => $(x).hidden = x !== id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const medal = i => ['🥇', '🥈', '🥉'][i] || (i + 1);
const sorted = () => [...st.players].sort((a, b) => b.score - a.score);
const copy = async (t, b) => {
  try { await navigator.clipboard.writeText(t); const o = b.textContent; b.textContent = '복사됨!'; setTimeout(() => b.textContent = o, 1500); }
  catch { prompt('복사해서 친구에게 보내세요', t); }
};

$('code').value = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
const enter = (ev, ...a) => s.emit(ev, ...a, r => {
  if (r.err) return $('err').textContent = r.err;
  history.replaceState(0, '', '?room=' + r.code);
});
$('mk').onclick = () => enter('create', $('nm').value.trim());
$('jn').onclick = () => enter('join', $('code').value.trim(), $('nm').value.trim());
$('cl').onclick = () => copy(location.href, $('cl'));
$('go').onclick = () => s.emit('start');
$('again').onclick = () => s.emit('again');
$('share').onclick = () => copy('🏆 3분 퀴즈파티 결과\n' + sorted().map((p, i) => `${i + 1}등 ${p.name} ${p.score}점`).join('\n') + '\n' + location.href, $('share'));

s.on('state', x => {
  st = x;
  const host = x.host === s.id;
  if (x.phase === 'lobby') {
    show('lobby'); $('res').hidden = true;
    $('rc').textContent = x.code;
    $('pl').innerHTML = x.players.map(p => `<span class="chip">${esc(p.name)}</span>`).join('');
    $('go').hidden = !host; $('wait').hidden = host;
    $('again').hidden = !host;
  }
  if (x.phase === 'end') {
    show('end'); $('res').hidden = true;
    $('rk').innerHTML = sorted().map((p, i) => `<li><b>${medal(i)}</b> ${esc(p.name)}<span>${p.score}점</span></li>`).join('');
    $('again').hidden = !host;
  }
});

s.on('step', x => {
  show('play'); over = false; cnt = 0;
  $('res').hidden = true; $('feed').innerHTML = '';
  $('top').textContent = `${x.i + 1}/${x.n} ${x.title}`;
  $('hint').textContent = x.hint;
  $('qq').textContent = x.t === 'quiz' ? x.q : '👆';
  $('qf').hidden = x.t !== 'quiz'; $('tap').hidden = x.t !== 'tap';
  $('tap').textContent = 'TAP!';
  $('ans').value = ''; $('ans').disabled = false;
  if (x.t === 'quiz') $('ans').focus();
  const bar = $('bar');
  bar.style.transition = 'none'; bar.style.width = '100%';
  requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = `width ${x.sec}s linear`; bar.style.width = '0'; }));
});

$('qf').onsubmit = e => {
  e.preventDefault();
  const v = $('ans').value.trim();
  if (!v || over) return;
  s.emit('answer', v, ok => {
    if (ok) { $('ans').disabled = true; $('ans').value = '정답! 🎉'; }
    else { $('ans').value = ''; $('ans').classList.add('shake'); setTimeout(() => $('ans').classList.remove('shake'), 300); }
  });
};
$('tap').onpointerdown = () => { if (over) return; cnt++; s.emit('tap'); $('tap').textContent = cnt; };
s.on('solved', x => $('feed').insertAdjacentHTML('afterbegin', `<div>✅ ${esc(x.name)} +${x.g}점</div>`));

s.on('result', x => {
  over = true; $('ans').disabled = true;
  $('res').hidden = false;
  $('ra').textContent = x.answer ? `정답: ${x.answer}` : '연타 결과';
  $('rg').textContent = `+${x.gained[s.id] || 0}점`;
  $('rb').innerHTML = sorted().map((p, i) =>
    `<li><b>${i + 1}</b> ${esc(p.name)}${x.answer ? '' : ' · ' + (x.taps[p.id] || 0) + '회'}<span>${p.score}점</span></li>`).join('');
});
</script></body></html>
